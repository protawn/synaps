<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>synaps — GSAP Example</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="../src/synaps.js"></script>

  <style>
    .price { font-size: 24px; }
  </style>
</head>
<body>

  <h2>GSAP Animation</h2>

  <div class="price js-price">$30.00</div>
  <button id="update">Update Price</button>

  <script>
    synaps.bind({ price: ".js-price" });

    // Stable object — no animation on initial load
    synaps.price = {
      text: "$30.00",
      animate: {
        out(el) {
          gsap.to(el, { opacity: 0, y: -10, duration: 0.3 });
        },
        in(el) {
          gsap.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 });
        },
        swap: "text"
      }
    };

    document.querySelector("#update").onclick = () => {
      // Only update the text field — animation runs because content changes
      synaps.update("price", "text", "$18.00");
    };
  </script>

</body>
</html>
