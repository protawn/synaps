<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>synaps — Basic Binding Example</title>
  <script src="../src/synaps.js"></script>
  <style>
    .box { padding: 10px; background: #eee; display: inline-block; }
  </style>
</head>
<body>

  <h2>Basic Binding</h2>

  <div class="box js-count">0</div>
  <button id="inc">Increment</button>

  <script>
    synaps.bind({
      count: ".js-count"
    });

    synaps.count = 0;

    document.querySelector("#inc").onclick = () => {
      synaps.count++;
    };
  </script>

</body>
</html>
