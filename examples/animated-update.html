<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>synaps — Animated Update Example</title>
  <script src="../src/synaps.js"></script>

  <style>
    .anim-fadeOut { animation: fadeOut 0.3s forwards; }
    .anim-fadeIn  { animation: fadeIn 0.3s forwards; }

    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <h2>Animated Update</h2>

  <div class="js-price">$24.99</div>
  <button id="update">Update Price</button>

  <script>
    synaps.bind({ price: ".js-price" });

    // Stable object — no animation on load
    synaps.price = {
      text: "$24.99",
      animate: {
        out: "anim-fadeOut",
        in: "anim-fadeIn",
        duration: 300,
        swap: "text"
      }
    };

    document.querySelector("#update").onclick = () => {
      // Only update the text field — animation runs because content changes
      synaps.update("price", "text", "$22.99");
    };
  </script>

</body>
</html>
