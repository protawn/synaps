<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>synaps — Web Animations API Example</title>
  <script src="../src/synaps.js"></script>

  <style>
    .price { font-size: 24px; }
  </style>
</head>
<body>

  <h2>Web Animations API</h2>

  <div class="price js-price">$20.00</div>
  <button id="update">Update Price</button>

  <script>
    synaps.bind({ price: ".js-price" });

    synaps.price = {
      text: "$20.00",
      animate: {
        out(el) {
          return el.animate(
            [{ opacity: 1 }, { opacity: 0 }],
            { duration: 200 }
          ).finished;
        },
        in(el) {
          return el.animate(
            [{ opacity: 0 }, { opacity: 1 }],
            { duration: 200 }
          ).finished;
        },
        swap: "text"
      }
    };

    document.querySelector("#update").onclick = () => {
      synaps.update("price", "text", "$17.50");
    };
  </script>

</body>
</html>
